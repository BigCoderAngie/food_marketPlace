spring.application.name=marketplace

# --- Database -------------------------------------------------------------
# Default: an H2 database stored in ./data so the app runs with no setup.
# For MySQL run with: --spring.profiles.active=mysql (see application-mysql.properties)
spring.datasource.url=jdbc:h2:file:./data/eatna;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- Uploads --------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Eat.na settings ------------------------------------------------------
eatna.timezone=Africa/Windhoek
eatna.base-url=http://localhost:8080
eatna.upload-dir=uploads
# Load demo sellers, menus and accounts on first start
eatna.seed-demo-data=true
# Set to true once a WhatsApp/SMS provider is wired in NotificationService
eatna.notifications.whatsapp-enabled=false
