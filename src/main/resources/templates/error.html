<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap" style="max-width:560px">
    <h1 th:text="${status == 404} ? 'Page not found' : (${status == 403} ? 'Not allowed' : 'Something went wrong')">Error</h1>
    <p th:if="${status == 404}">That page doesn't exist, or the seller isn't public.</p>
    <p th:if="${status == 403}">Your account can't open this page. If you were filling in a form, reload and try again.</p>
    <p th:if="${status != 404 and status != 403}">Please try again in a moment.</p>
    <a class="btn" th:href="@{/}">Go to the home page</a>
</main>
</body>
</html>
