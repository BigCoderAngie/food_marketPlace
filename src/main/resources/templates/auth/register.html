<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Create an account')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap" style="max-width:480px">
    <h1>Create an account</h1>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <form class="card" th:action="@{/register}" method="post">
        <input type="hidden" name="next" th:value="${next != null ? next : param.next}">
        <label for="name" style="margin-top:0">Your name</label>
        <input id="name" name="name" type="text" th:value="${name}" required autocomplete="name">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" th:value="${phone}" placeholder="081 234 5678" autocomplete="tel">
        <label for="email">Email (optional if you give a phone)</label>
        <input id="email" name="email" type="email" th:value="${email}" autocomplete="email">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
        <div class="hint">At least 8 characters.</div>
        <button class="btn block" type="submit" style="margin-top:16px">Create account</button>
    </form>
    <p>Already have an account? <a th:href="@{/login}">Log in</a>. Want to sell food? <a th:href="@{/register/seller}">Register as a seller</a>.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
